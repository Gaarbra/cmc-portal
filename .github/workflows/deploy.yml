name: Deploy to Namecheap

# Builds the site and uploads dist/ to Namecheap hosting over FTPS.
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    e.g. ftp.yourdomain.com  (cPanel → FTP Accounts → Configure FTP Client)
#   FTP_USERNAME  the FTP account, e.g. deploy@yourdomain.com
#   FTP_PASSWORD  that account's password
# Optional repository variable:
#   FTP_DIR       remote folder, default "public_html/"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to Namecheap
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
      - name: Skip notice
        if: env.HAS_FTP != 'true'
        run: echo "::notice::FTP secrets not set, so the build was checked but not deployed."
